version: "3.9"

services:

  # ---------------------------
  # Infrastructure services
  # ---------------------------

  mysql:
    image: mysql:8.4
    container_name: mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_USER: app
      MYSQL_PASSWORD: app
      MYSQL_DATABASE: url_service_db
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./infra/init-db.sql:/docker-entrypoint-initdb.d/init-db.sql
    networks:
      - backend

  rabbitmq:
    image: rabbitmq:3-management
    container_name: rabbitmq
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: app
      RABBITMQ_DEFAULT_PASS: app
    ports:
      - "5672:5672"   # AMQP
      - "15672:15672" # Management UI
    networks:
      - backend

  # ---------------------------
  # Discovery + Gateway
  # ---------------------------

  discovery-service:
    build:
      context: ./api-gateway
      dockerfile: discovery-service/Dockerfile
    container_name: discovery-service
    restart: unless-stopped
    ports:
      - "8761:8761"
    networks:
      - backend

  api-gateway:
    build:
      context: ./api-gateway
      dockerfile: api-gateway/Dockerfile
    container_name: api-gateway
    restart: unless-stopped
    depends_on:
      - discovery-service
    environment:
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://discovery-service:8761/eureka
    ports:
      - "8080:8080"
    networks:
      - backend

  frontend:
    build:
      context: ./Link-Shortner front
      dockerfile: Dockerfile
    container_name: url-shortener-frontend
    restart: unless-stopped
    depends_on:
      - api-gateway
    environment:
      PORT: 80
      API_GATEWAY_HOSTPORT: api-gateway:8080
    ports:
      - "3000:80"
    networks:
      - backend

  # ---------------------------
  # Application services
  # ---------------------------

  url-service:
    build:
      context: ./url-service/url-service
      dockerfile: Dockerfile
    container_name: url-service
    restart: unless-stopped
    depends_on:
      - mysql
      - rabbitmq
      - discovery-service
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/url_service_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      SPRING_DATASOURCE_USERNAME: app
      SPRING_DATASOURCE_PASSWORD: app
      SPRING_JPA_DATABASE_PLATFORM: org.hibernate.dialect.MySQL8Dialect
      SPRING_RABBITMQ_HOST: rabbitmq
      SPRING_RABBITMQ_USERNAME: app
      SPRING_RABBITMQ_PASSWORD: app
      PUBLIC_BASE_URL: http://localhost:8080
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://discovery-service:8761/eureka
    ports:
      - "8081:8081"
    networks:
      - backend

  analytics-service:
    build:
      context: ./analytics-service/analytics-service
      dockerfile: Dockerfile
    container_name: analytics-service
    restart: unless-stopped
    depends_on:
      - rabbitmq
      - mysql
      - discovery-service
    environment:
      SPRING_RABBITMQ_HOST: rabbitmq
      SPRING_RABBITMQ_USERNAME: app
      SPRING_RABBITMQ_PASSWORD: app
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/analytics_service_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      SPRING_DATASOURCE_USERNAME: app
      SPRING_DATASOURCE_PASSWORD: app
      SPRING_JPA_DATABASE_PLATFORM: org.hibernate.dialect.MySQL8Dialect
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://discovery-service:8761/eureka
    ports:
      - "8082:8082"
    networks:
      - backend

networks:
  backend:
    driver: bridge

volumes:
  mysql_data:

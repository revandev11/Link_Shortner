server:
  port: 8080

spring:
  application:
    name: api-gateway

  cloud:
    gateway:
      routes:

        # POST /api/urls -> url-service (yeni link qısaltmaq üçün)
        - id: url-service-api
          uri: lb://url-service
          predicates:
            - Path=/api/urls/**

        # GET /{shortCode} -> url-service (redirect üçün)
        - id: url-service-redirect
          uri: lb://url-service
          predicates:
            - Path=/{shortCode}

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka
  instance:
    prefer-ip-address: true

management:
  endpoints:
    web:
      exposure:
        include: health,info,gateway
